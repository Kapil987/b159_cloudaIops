[project]
name = "law-firm-contract-assistant"
version = "0.1.0"
description = "Course project: a LangGraph + Bedrock Knowledge Base + Postgres assistant for a law firm's contract questions"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.35.0",
    "streamlit>=1.38.0",
    "psycopg[binary]>=3.2.3",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.2",
]
